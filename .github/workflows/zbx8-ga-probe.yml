# TEMPORARY diagnostic — delete once the 8.0 question is settled.
#
# detect.sh's version block says to confirm a new Zabbix major on the
# lifecycle page, NOT on the packages staged under repo.zabbix.com/zabbix/8.0/
# (those have existed since Oct 2025 and are pre-release). zabbix.com is
# unreachable from the dev sandbox, so this asks a GitHub runner instead —
# the same trick used for the macOS CDN listing in 197a413.
#
# Every step is non-fatal: the point is to SEE the evidence, not to gate a
# build. The last step prints a verdict from what the earlier steps found.
name: zbx8-ga-probe

on:
  push:
    branches: [claude/nice-bardeen-86hqaw]
    paths: [".github/workflows/zbx8-ga-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Lifecycle page — Zabbix's own GA/EOL table
        run: |
          set +e
          curl -fsSL --max-time 30 https://www.zabbix.com/life_cycle_and_release_policy -o lc.html
          echo "curl exit=$? bytes=$(wc -c <lc.html 2>/dev/null || echo 0)"
          # v1 grep missed the table: the version cells are not at line start.
          # Print the window that begins at the "Release date" header instead.
          sed -e 's/<[^>]*>/\n/g' lc.html 2>/dev/null |
            sed -e 's/&nbsp;/ /g' -e 's/^[[:space:]]*//' -e '/^$/d' >lc.txt
          start="$(grep -n 'Release date' lc.txt | head -1 | cut -d: -f1)"
          echo "--- lifecycle table, from line ${start:-1} ---"
          sed -n "${start:-1},$((${start:-1} + 70))p" lc.txt

      - name: 2. Release notes — does a FINAL rn8.0.0 exist, or only pre-releases?
        run: |
          set +e
          for p in rn8.0.0 rn8.0.0rc3 rn8.0.0beta2 rn7.4.0 rn7.0.0 rn8.0.1 rn8.0.2; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://www.zabbix.com/rn/$p")"
            printf '%-16s HTTP %s\n' "$p" "$code"
          done
          echo "--- title of rn8.0.0 (a final release has no alpha/beta/rc in it) ---"
          curl -fsSL --max-time 20 https://www.zabbix.com/rn/rn8.0.0 |
            grep -oiE '<title>[^<]*</title>|Zabbix 8\.0\.0[a-z0-9]*' | head -5

      - name: 3. Download page — is 8.0 offered, and is it labelled LTS?
        run: |
          set +e
          curl -fsSL --max-time 30 https://www.zabbix.com/download -o dl.html
          echo "curl exit=$? bytes=$(wc -c <dl.html 2>/dev/null || echo 0)"
          grep -oiE '8\.0 LTS|7\.4[^<]{0,12}|8\.0[^<]{0,12}' dl.html 2>/dev/null |
            sort -u | head -20

      - name: 4. The URLs the installer itself would fetch (real builders from src/)
        run: |
          set +e
          # Source the real modules so this probes the code's own URL shapes,
          # not a copy that can drift. repo.sh needs core.sh's globals.
          set -u
          source src/lib/core.sh 2>/dev/null || true
          source src/lib/repo.sh 2>/dev/null || true
          probe() { # probe DESC URL
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -r 0-0 "$2")"
            printf '  %-7s %-6s %s\n' "HTTP $code" "$1" "$2"
          }
          for zv in 7.0 7.4 8.0; do
            echo "=== Zabbix $zv ==="
            for layout in flat legacy; do
              probe "$layout" "$(zbx_release_url "$layout" debian ubuntu 24.04 24 "$zv" x86_64)"
              probe "$layout" "$(zbx_release_url "$layout" rhel rhel 9 9 "$zv" x86_64)"
              probe "$layout" "$(zbx_release_url "$layout" rhel amzn 2023 2023 "$zv" x86_64)"
              probe "$layout" "$(zbx_release_url "$layout" suse sles 15 15 "$zv" x86_64)"
            done
          done

      - name: 5. Published package versions — GA build numbers, or rc/beta?
        run: |
          set +e
          # v1 used pool/main/z/zabbix-server/ and rhel/9/x86_64/, both 404:
          # a Debian pool is keyed by SOURCE package name (z/zabbix/), and the
          # rhel tree nests the arch under a different level. Walk the tree.
          ls_href() { # ls_href URL — print the links in an autoindex page
            curl -fsSL --max-time 30 "$1" |
              grep -oE 'href="[^"]+"' | sed -e 's/href="//' -e 's/"$//' | head -"${2:-25}"
          }
          for u in \
            https://repo.zabbix.com/zabbix/8.0/release/ \
            https://repo.zabbix.com/zabbix/8.0/release/ubuntu/pool/main/z/ \
            https://repo.zabbix.com/zabbix/8.0/release/rhel/9/ ; do
            echo "=== $u ==="
            ls_href "$u"
          done
          echo "=== server packages actually published for 8.0 (ubuntu) ==="
          curl -fsSL --max-time 30 \
            https://repo.zabbix.com/zabbix/8.0/release/ubuntu/pool/main/z/zabbix/ |
            grep -oE 'zabbix-server-mysql_[^"]+\.deb' | sort -u | head -10
          echo "=== and for rhel 9 ==="
          curl -fsSL --max-time 30 \
            https://repo.zabbix.com/zabbix/8.0/release/rhel/9/x86_64/ |
            grep -oE 'zabbix-server-mysql-[^"]+\.rpm' | sort -u | head -10

      - name: 6. Verdict
        run: |
          set +e
          rn="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.zabbix.com/rn/rn8.0.0)"
          title="$(curl -fsSL --max-time 20 https://www.zabbix.com/rn/rn8.0.0 |
            grep -oiE '<title>[^<]*</title>' | head -1)"
          # The download page is the plainest statement Zabbix makes.
          dl="$(curl -fsSL --max-time 30 https://www.zabbix.com/download |
            grep -coE '8\.0 LTS is out|"8\.0 LTS"')"
          # Real server packages, from the corrected pool path.
          ga="$(curl -fsSL --max-time 30 \
            https://repo.zabbix.com/zabbix/8.0/release/ubuntu/pool/main/z/zabbix/ |
            grep -coE 'zabbix-server-mysql_8\.0\.[0-9]+-[0-9]')"
          pre="$(curl -fsSL --max-time 30 \
            https://repo.zabbix.com/zabbix/8.0/release/ubuntu/pool/main/z/zabbix/ |
            grep -coE '8\.0\.0(alpha|beta|rc)')"
          # The URL the installer itself would fetch, via repo.sh's own builder.
          source src/lib/core.sh 2>/dev/null || true
          source src/lib/repo.sh 2>/dev/null || true
          rel="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -r 0-0 \
            "$(zbx_release_url legacy debian ubuntu 24.04 24 8.0 x86_64)")"
          echo "rn8.0.0=$rn  title=$title"
          echo "download-page 8.0-LTS mentions=$dl  GA-numbered server debs=$ga  pre-release debs=$pre"
          echo "installer's own zabbix-release URL for 8.0 => HTTP $rel"
          ok=0
          [[ "$rn" == "200" && "$title" != *alpha* && "$title" != *beta* && "$title" != *rc* ]] && ok=$((ok + 1))
          [[ "${dl:-0}" -gt 0 ]] && ok=$((ok + 1))
          [[ "${ga:-0}" -gt 0 ]] && ok=$((ok + 1))
          [[ "$rel" == "206" || "$rel" == "200" ]] && ok=$((ok + 1))
          echo "signals passed: $ok/4"
          if ((ok >= 3)); then
            echo "VERDICT: 8.0 IS GA — safe to add to SUPPORTED_ZBX_VERSIONS (keep the default at 7.0 until a real-install CI job is green)."
          else
            echo "VERDICT: NOT confirmed GA — do not enable 8.0 yet."
          fi
